<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Camera</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding: 2rem 1rem; }
  input, button { font-size: 1.2rem; padding: 0.6rem 1rem; margin-top: 1rem; }
  #status { margin-top: 1rem; min-height: 1.5em; }
</style>
</head>
<body>
  <h1>Badge Camera</h1>
  <p>Take a photo -- it'll show up on the badge screen.</p>
  <input id="file" type="file" accept="image/*" capture="environment">
  <div id="status"></div>
  <canvas id="canvas" width="320" height="240" style="display:none"></canvas>
<script>
const W = 320, H = 240;
const fileInput = document.getElementById('file');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  status.textContent = 'Processing...';

  const img = new Image();
  img.onload = () => {
    // Center-crop the source image to the badge's 4:3 box, then scale to fill.
    const targetAspect = W / H;
    const srcAspect = img.width / img.height;
    let sx, sy, sw, sh;
    if (srcAspect > targetAspect) {
      sh = img.height;
      sw = sh * targetAspect;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / targetAspect;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);

    const rgba = ctx.getImageData(0, 0, W, H).data;
    const rgb565 = new Uint8Array(W * H * 2);
    for (let i = 0, j = 0; i < rgba.length; i += 4, j += 2) {
      const r = rgba[i], g = rgba[i + 1], b = rgba[i + 2];
      const word = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
      // Big-endian on the wire -- the badge's SPI panel expects the high
      // byte first (same byte order LVGL's swap_bytes flag produces).
      rgb565[j] = (word >> 8) & 0xFF;
      rgb565[j + 1] = word & 0xFF;
    }

    status.textContent = 'Uploading...';
    fetch('/upload', { method: 'POST', body: rgb565 })
      .then(r => { status.textContent = r.ok ? 'Sent! Check the badge.' : 'Upload failed.'; })
      .catch(() => { status.textContent = 'Upload failed.'; });
  };
  img.onerror = () => { status.textContent = 'Could not read photo.'; };
  img.src = URL.createObjectURL(file);
});
</script>
</body>
</html>
